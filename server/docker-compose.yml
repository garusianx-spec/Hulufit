# Local stack: the gateway plus an S3-compatible bucket.
#   docker compose up -d
#   → gateway  http://localhost:4000
#   → MinIO    http://localhost:9001  (hellofit / hellofit-secret)

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hellofit
      MINIO_ROOT_PASSWORD: hellofit-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once MinIO is up, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hellofit hellofit-secret &&
      mc mb --ignore-existing local/hellofit-media &&
      mc anonymous set download local/hellofit-media/avatars &&
      echo 'bucket ready'
      "

  gateway:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or .env}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: hellofit-media
      S3_ACCESS_KEY: hellofit
      S3_SECRET_KEY: hellofit-secret
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_BYTES: "31457280"
    ports:
      - "4000:4000"

volumes:
  minio-data:
